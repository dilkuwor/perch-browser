services:
  perch-browser:
    image: dpksamir/perch-browser:latest
    container_name: perch-browser
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      APP_USER: ${APP_USER:-admin}
      HOST: 0.0.0.0
      PORT: "8080"
      HOME_URL: ${HOME_URL:-https://www.google.com/}
      CHROME_NO_SANDBOX: "1"
      CHROME_HEADLESS: "0"
      CHROME_USER_DATA: /data/chrome
      JPEG_QUALITY: ${JPEG_QUALITY:-60}
      AUDIO: ${AUDIO:-1}
      AUDIO_BITRATE: ${AUDIO_BITRATE:-96}
    volumes:
      - chrome-profile:/data/chrome
    shm_size: "1gb"
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chrome-profile:
