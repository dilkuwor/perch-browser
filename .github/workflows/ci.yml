name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force build and push Docker image"
        required: true
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: perch-browser

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          node --check src/server.js
          node --check src/auth.js
          node --check src/browser.js
          node --check public/app.js

      - name: Test
        run: npm test

  image:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    needs: [app]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed image
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
        run: |
          set -euo pipefail

          image=false

          if [ "$FORCE_ALL" = "true" ]; then
            echo "Force build enabled: building image"
            image=true

          elif [ -z "${BEFORE:-}" ] || \
               [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit detected: building image"
            image=true

          else
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"

            echo "Changed files:"
            echo "$changed"

            echo "$changed" | grep -Eq '^(src/|public/|Dockerfile|\.dockerignore|package\.json|package-lock\.json)' \
              && image=true || true
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.image == 'true'

      - uses: docker/login-action@v3
        if: steps.changes.outputs.image == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every image gets a new build number (this workflow's run number) plus the commit
      # and date, which the app shows on /health and the login page.
      - name: Build and push
        if: steps.changes.outputs.image == 'true'
        env:
          SHA: ${{ github.sha }}
          BUILD: ${{ github.run_number }}
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          docker buildx build \
            --push \
            --build-arg "PERCH_BUILD=$BUILD" \
            --build-arg "PERCH_COMMIT=$SHA" \
            --build-arg "PERCH_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$NS/$IMAGE_NAME:$SHA" \
            -t "$NS/$IMAGE_NAME:$VERSION-$BUILD" \
            -t "$NS/$IMAGE_NAME:latest" \
            .
