# Added by `dockyard deploy`. Builds the image, pushes it to ghcr.io and tells Dockyard to deploy it.
# Also publishes linux/arm64 in the same tags for a 64-bit Raspberry Pi.
# `dockyard deploy` rewrites this file from its template and will drop the arm64 lines.
name: Deploy to Dockyard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 is cross-built on the amd64 runner. amd64 is still the variant Dockyard pulls.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names on ghcr.io must be lowercase.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          # A plain manifest list. Provenance attestations make the digest an OCI index
          # that older Docker installs (the Pi, and Dockyard) can fail to pull.
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Tell Dockyard to deploy
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          HOOK_URL: ${{ secrets.DOCKYARD_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.DOCKYARD_HOOK_SECRET }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          BODY=$(jq -nc --arg image "$IMAGE" --arg digest "$DIGEST" --arg commit "$GITHUB_SHA" \
            '{image: $image, digest: $digest, commit: $commit}')
          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -hex | sed 's/^.* //')
          curl -fsS -X POST "$HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Dockyard-Timestamp: $TS" \
            -H "X-Dockyard-Signature: sha256=$SIG" \
            -d "$BODY"
