<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080b" />
  <title>Home Browser — bytetech.cloud</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='8' width='32' height='32' fill='%2312161f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%236ea8ff' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%236ea8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="login-screen" class="screen login-screen">
    <div class="login-glow" aria-hidden="true"></div>
    <div class="login-card">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="48" height="48">
          <rect x="4" y="8" width="40" height="32" rx="8" fill="#12161f" stroke="#2a3344" />
          <circle cx="12" cy="16" r="2" fill="#ff5f57" />
          <circle cx="18" cy="16" r="2" fill="#febc2e" />
          <circle cx="24" cy="16" r="2" fill="#28c840" />
          <rect x="10" y="22" width="28" height="10" rx="5" fill="#0a0d12" stroke="#2a3344" />
        </svg>
      </div>
      <p class="brand">bytetech.cloud</p>
      <h1>Home Browser</h1>
      <p class="login-lead">Remote Chromium on your home server. Pages load there, not on this device.</p>
      <form id="login-form" autocomplete="on">
        <label class="field">
          <span>Password</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            spellcheck="false"
          />
        </label>
        <button type="submit" class="primary-btn" id="login-btn">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>
  </div>

  <div id="app-screen" class="screen app-screen" hidden>
    <div id="shell" class="browser-window">
      <header class="titlebar" id="titlebar">
        <div class="traffic-lights" aria-hidden="true">
          <span class="tl red"></span>
          <span class="tl yellow"></span>
          <span class="tl green"></span>
        </div>
        <div class="tabstrip">
          <div class="tabs" id="tabs" role="tablist"></div>
          <button type="button" class="tab-new" id="btn-newtab" title="New tab" aria-label="New tab">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
        <div class="titlebar-flex" aria-hidden="true"></div>
        <div class="titlebar-actions">
          <div class="latency-wrap">
            <button type="button" class="icon-btn latency-btn" id="btn-latency" title="Latency" aria-label="Show latency">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 17l5-6 4 4 4-7 5 5" />
              </svg>
              <span class="latency-dot" id="latency-dot" aria-hidden="true"></span>
            </button>
            <div class="latency-panel" id="latency-panel" hidden>
              <div class="latency-row"><span>Round trip</span><strong id="lat-rtt">…</strong></div>
              <div class="latency-row"><span>Frames</span><strong id="lat-fps">…</strong></div>
              <div class="latency-row"><span>Bandwidth</span><strong id="lat-bw">…</strong></div>
              <div class="latency-row"><span>Remote view</span><strong id="lat-size">…</strong></div>
            </div>
          </div>
          <button type="button" class="icon-btn" id="btn-focus" title="Focus mode" aria-label="Focus mode">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="3.2" />
              <path d="M4 12h4M16 12h4M12 4v4M12 16v4" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="btn-maximize" title="Maximize" aria-label="Maximize">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="5" y="5" width="14" height="14" rx="2" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="btn-fullscreen" title="Fullscreen (F11)" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="btn-logout" title="Sign out" aria-label="Sign out">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M10 7V5a2 2 0 0 1 2-2h7v18h-7a2 2 0 0 1-2-2v-2" />
              <path d="M4 12h11M12 8l4 4-4 4" />
            </svg>
          </button>
        </div>
      </header>

      <div class="toolbar">
        <div class="nav">
          <button type="button" class="icon-btn" id="btn-back" title="Back" aria-label="Back">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M15 5l-7 7 7 7" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="btn-forward" title="Forward" aria-label="Forward">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M9 5l7 7-7 7" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="btn-reload" title="Reload" aria-label="Reload">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 12a8 8 0 1 1-2.3-5.6" />
              <path d="M20 4v5h-5" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="btn-home" title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 11.5 12 4l8 7.5" />
              <path d="M6.5 10.5V20h11V10.5" />
            </svg>
          </button>
        </div>
        <form id="omnibox-form" class="omnibox" action="#">
          <span class="omnibox-lock" title="Connection handled by home Chromium" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V8a4 4 0 0 1 8 0v3" />
            </svg>
          </span>
          <input
            id="address"
            class="omnibox-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            placeholder="Search Google or type a URL"
          />
          <button type="submit" class="go-btn" id="btn-go">Go</button>
        </form>
        <button type="button" class="icon-btn" id="btn-kbd" title="Keyboard" aria-label="Show keyboard">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10" />
          </svg>
        </button>
      </div>

      <div id="viewport" class="viewport" tabindex="0">
        <div id="start-page" class="start-page">
          <p class="start-kicker">bytetech.cloud</p>
          <h2>New Tab</h2>
          <p class="start-sub">This Chromium runs on the home server. What is my IP is the house public IP.</p>
          <form id="start-search" class="start-search" action="#">
            <input id="start-q" type="text" placeholder="Search Google or type a URL" spellcheck="false" autocomplete="off" />
          </form>
          <div class="dials">
            <button type="button" class="dial" data-url="https://www.google.com/">
              <span class="dial-icon google">G</span>
              <span class="dial-label">Google</span>
            </button>
            <button type="button" class="dial" data-url="https://www.youtube.com/">
              <span class="dial-icon youtube">▶</span>
              <span class="dial-label">YouTube</span>
            </button>
            <button type="button" class="dial" data-url="https://ifconfig.me/">
              <span class="dial-icon ip">IP</span>
              <span class="dial-label">Find my IP</span>
            </button>
            <button type="button" class="dial" data-url="https://www.wikipedia.org/">
              <span class="dial-icon wiki">W</span>
              <span class="dial-label">Wikipedia</span>
            </button>
          </div>
        </div>
        <div id="loading-page" class="loading-page">Loading remote page…</div>
        <canvas id="stream" class="stream" aria-hidden="true"></canvas>
        <textarea id="kbd" class="kbd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Remote keyboard input"></textarea>
      </div>

      <footer class="statusbar" id="statusbar">
        <span class="status-left">
          <span id="ws-dot" class="ws-dot" title="WebSocket"></span>
          <span id="status-text">Start page</span>
        </span>
        <span class="status-right">
          <span id="ip-chip" class="ip-chip" title="Home server public IP">IP · …</span>
        </span>
      </footer>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
